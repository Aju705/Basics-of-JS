<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript_basics</title>
</head>
<body>
    <h1>Async functionality</h1>
    <button id="stop">Stop</button>
</body>
<script>
    const sayAjinkya = function(){
        console.log("Ajinkya");
        
    }
    const changeText = function(){
        document.querySelector('h1').innerHTML='Async part 2'
    }

    const changeMe = setTimeout(changeText,2000)

    document.querySelector('#stop').addEventListener('click', function(){
        clearTimeout(changeMe)
        console.log('Stopped');
        
    })

    
</script>
</html>
